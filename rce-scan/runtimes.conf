# 运行时高危漏洞自查预设（rce-scan）
# 格式：runtime|bins|pkgs|grep|entry_grep
#   bins      宿主可执行文件名
#   pkgs      包管理器里的包名关键词
#   grep      容器镜像 / 仓库 / 依赖清单里的关键词
#   entry_grep Web 服务器生效配置里的转发关键词（判断是否真的接到这个运行时）

php|php php-fpm php8 php8.2 php8.3 php8.4 php8.5|php php-fpm php-cli php-common|php|php-fpm|fastcgi_pass|\.php
node|node nodejs|nodejs node|node|nodejs|proxy_pass.*node|pm2
java|java javac|java-.*openjdk|java|openjdk|tomcat|proxy_pass.*(8080|tomcat)
python|python python3|python3 python|python|python3|uwsgi|gunicorn|proxy_pass.*(8000|5000)
ruby|ruby|ruby|ruby|puma|unicorn|passenger
dotnet|dotnet|dotnet|dotnet|aspnet|proxy_pass.*(5000|dotnet)
